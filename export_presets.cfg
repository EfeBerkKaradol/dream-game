html/head_include="<meta name=\"theme-color\" content=\"#1f2445\">
<style>
html, body, canvas { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
#rp-rotate { display: none; }
@media (orientation: portrait) and (pointer: coarse) {
  #rp-rotate { display: flex; position: fixed; inset: 0; z-index: 1000; background: #1f2445; color: #fcefc0; flex-direction: column; align-items: center; justify-content: center; gap: 24px; font: 700 26px/1.3 sans-serif; text-align: center; padding: 24px; }
  #rp-rotate .phone { width: 64px; height: 108px; border: 6px solid #fcefc0; border-radius: 14px; animation: rp-turn 2.4s ease-in-out infinite; }
}
@keyframes rp-turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(90deg); } }
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var d = document.createElement('div');
  d.id = 'rp-rotate';
  d.innerHTML = '<div class=\"phone\"></div><div>Telefonu yan çevir</div>';
  document.body.appendChild(d);
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
});
</script>"
